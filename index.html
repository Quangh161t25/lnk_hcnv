<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Vũ Gia - Hệ thống Quản trị Doanh nghiệp ERP</title>
    <meta property="og:title" content="Vũ Gia ERP" />
    <meta property="og:description" content="Hệ thống Quản lý Hành chính & Nhân sự Doanh nghiệp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Áp dụng chế độ tối + cỡ chữ + màu chủ đạo ngay khi tải (trước React) để tránh nháy -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('ui-storage');
          var state = raw ? (JSON.parse(raw) || {}).state || {} : {};
          var el = document.documentElement;
          var scheme = state.colorScheme;
          var isDark =
            scheme === 'dark' ||
            (scheme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) el.classList.add('dark');
          el.dataset.textSize = state.fontSize || 'medium';
          var colorMap = {
            blue: '221.2 83.2% 53.3%', violet: '262.1 83.3% 57.8%', emerald: '142.1 76.2% 36.3%', rose: '346.8 77.2% 49.8%',
            amber: '37.7 92.1% 50.2%', orange: '24.6 95% 53.1%', cyan: '188.7 94.5% 42.7%', slate: '215.4 16.3% 46.9%'
          };
          var v = colorMap[state.primaryColor || 'blue'];
          el.style.setProperty('--primary', v);
          el.style.setProperty('--ring', v);
          el.style.setProperty('--secondary-foreground', v);
          el.style.setProperty('--accent-foreground', v);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
